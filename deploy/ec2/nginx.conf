# Install as /etc/nginx/sites-available/timesheet; replace example.com with your domain.
server {
    listen 80;
    server_name example.com;

    # nginx is the edge: overwrite X-Forwarded-For with the real peer so clients can't spoof it.
    location /backend/ {
        # Trailing slash on proxy_pass strips the /backend prefix: /backend/employees -> /employees.
        proxy_pass http://127.0.0.1:3333/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
